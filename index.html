<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Mart 실시간 주간 특가</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --main-blue: #00529b; --main-red: #ed1c24; --main-yellow: #fff200; }
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: #f8f9fa; }
        
        /* 헤더 스타일 */
        .header { background: var(--main-blue); color: var(--main-yellow); text-align: center; padding: 20px; font-weight: bold; }
        .header h1 { margin: 0; font-size: 2.5rem; text-transform: uppercase; }

        /* 카테고리 섹션 */
        .category-section { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .category-title { background: var(--main-yellow); color: var(--main-blue); padding: 10px 20px; font-size: 1.5rem; font-weight: bold; border-radius: 10px 10px 0 0; display: inline-block; }
        
        /* 상품 그리드 */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 15px; background: white; border: 3px solid var(--main-yellow); 
            padding: 20px; margin-bottom: 40px; border-radius: 0 10px 10px 10px;
        }

        /* 상품 카드 */
        .card { border: 1px solid #eee; padding: 15px; position: relative; text-align: center; display: flex; flex-direction: column; }
        .discount-tag { position: absolute; top: 0; right: 0; background: var(--main-red); color: white; padding: 5px 10px; font-weight: bold; border-radius: 0 0 0 10px; font-size: 1.2rem; }
        .product-img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px; }
        .product-name { font-size: 0.95rem; font-weight: bold; color: #333; margin: 10px 0; height: 40px; overflow: hidden; }
        .price { color: var(--main-red); font-size: 1.8rem; font-weight: bold; }
        .price::before { content: '£'; font-size: 1rem; vertical-align: top; }
    </style>
</head>
<body>

<div class="header">
    <p>Weekly SALE</p>
    <h1>H Mart 주간 특가</h1>
</div>

<div id="flyer-container" class="category-section">
    <p style="text-align: center;">데이터를 불러오는 중...</p>
</div>

<script>
    // 1. 여기에 게시한 구글 시트 CSV URL을 넣으세요
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQW5ts53gZDc6HzI3nuu64bijJLmI1YryKhpcIZhFM2DevkWQ7Q9JEjYJ4xeWcVuLIkReZdIwRFkg6H/pub?gid=0&single=true&output=csv';

    async function initFlyer() {
        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            
            Papa.parse(csvText, {
                header: true,
                complete: (results) => {
                    renderByGroup(results.data);
                }
            });
        } catch (error) {
            console.error("데이터 로드 실패:", error);
            document.getElementById('flyer-container').innerHTML = "데이터를 불러오는 데 실패했습니다.";
        }
    }

    function renderByGroup(data) {
        const container = document.getElementById('flyer-container');
        container.innerHTML = '';

        // 카테고리별로 데이터 묶기
        const groups = data.reduce((acc, item) => {
            if (!item.category) return acc;
            if (!acc[item.category]) acc[item.category] = [];
            acc[item.category].push(item);
            return acc;
        }, {});

        // 각 카테고리별로 화면에 그리기
        for (const [category, products] of Object.entries(groups)) {
            let categoryHtml = `
                <div class="category-title">${category}</div>
                <div class="product-grid">
                    ${products.map(p => `
                        <div class="card">
                            ${p.discount ? `<div class="discount-tag">${p.discount} OFF</div>` : ''}
                            <img class="product-img" src="${p.img_url}" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                            <div class="product-name">${p.name}</div>
                            <div class="price">${p.price}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            container.innerHTML += categoryHtml;
        }
    }

    initFlyer();
</script>

</body>
</html>
