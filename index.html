<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H Mart Weekly SALE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZSSJMFLNM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-HZSSJMFLNM');
    </script>
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet">
    <style>
      :root {
        --main-blue: #00529b;
        --main-red: #ff4e00;
        --main-yellow: #fffa62;
      }

      body {
        background: linear-gradient(180deg, #85b1f0, #e5edfa), #e5edfa;
        font-family: 'Suit', 'Arial', sans-serif;
        color: #000;
        margin: 0;
      }

      /* 헤더 스타일 */
      .header {
        display: block;
        width: 90vw;
        max-width: 1200px;
        color: #000;
        font-weight: 600;
        text-align: center;
        margin: 0 auto 5rem;
      }

      .header .logo_duration {
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 24px 0 12px;
      }

      .header .logo {
        width: 23vw;
        max-width: 200px;
        height: 100%;
      }

      .header .duration {
        font-size: 0.75rem;
        text-align: right;
        margin: 0;
        color: #fff;
      }

      .header .weekly_tit {
        width: 100%;
        text-align: center;
        margin: 0 auto;
      }

      .flyer-container {
        width: 90%;
        max-width: 1200px;
        position: relative;
      }

      .product-container {
        width: 100%;
        position: relative;
      }

      /* 프로모션 */
      .promotion-area {
        width: 100%;
        max-width: 1200px;
        margin: 2rem auto 0;
        text-align: center;
      }

      .promotion-area img {
        width: 100%;
        height: auto;
      }

      /* 카테고리 섹션 */
      .category-section {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
      }

      .category-title {
        width: fit-content;
        height: 120px;
        display: block;
        z-index: -1;
        position: absolute;
        top: calc(-1.25rem - 20px);
        left: 0px;
        background: var(--main-blue);
        color: var(--main-yellow);
        padding: 8px 20px;
        font-size: 1.25rem;
        font-weight: bold;
        border-radius: 16px;
      }

      /* 상품 그리드 */
      .product-grid {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        background: #f9f9f9;
        margin-bottom: 100px;
        border-radius: 16px;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 16px 8px;
        overflow: hidden;
      }

      /* 상품 카드 */
      .card {
        padding: 12px 0;
        position: relative;
        text-align: center;
        display: flex;
        flex-direction: column;
        width: auto !important;
        min-width: 0;
        box-sizing: border-box;
      }

      .en-product-name {
        font-size: 0.8rem;
        font-weight: 600;
      }

      .ko-product-name {
        font-size: 0.8rem;
        font-weight: 400;
        margin-top: 0.25rem;
      }

      .weight {
        color: #666;
        font-size: 0.75rem;
        margin-top: 0.5rem;
      }

      /* 할인율 딱지 */
      .discount-tag {
        position: absolute;
        top: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 1px;
        background: var(--main-yellow);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 1.5rem;
        font-weight: 800;
        box-shadow: 0 1px 2px #33333388;
        z-index: 100;
      }

      .discount-tag-per-off {
        text-align: left;
      }

      .per,
      .off {
        margin: 0;
      }

      .per {
        font-size: 0.75rem;
        margin-bottom: -2px;
      }

      .off {
        font-size: 0.5rem;
      }

      .buy-n-get-n-tag {
        position: absolute;
        right: 0;
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--main-red);
        color: var(--main-yellow);
        height: 2.5rem;
        width: 2.5rem;
        font-size: 0.75rem;
        font-weight: 900;
        text-align: center;
        vertical-align: middle;
        transform: rotate(20deg);
      }

      .buy-n-get-n-tag:before, .buy-n-get-n-tag:after {
        content: "";
        position: absolute;
        background: inherit;
        height: inherit;
        width: inherit;
        top: 0;
        left: 0;
        z-index: -1;
        transform: rotate(30deg);
      }

      .buy-n-get-n-tag:after {
        transform: rotate(150deg);
      }

      .product-img {
        width: 100%;
        height: 120px;
        margin-bottom: 8px;
        position: relative;
      }

      .product-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .price {
        color: var(--main-red);
        font-size: 1.25rem;
        font-weight: bold;
        margin-top: 0.5rem;
      }

      /* 기타 딱지 */
      .note-tag {
        position: absolute;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: bold;
        background: var(--main-red);
        color: #fff;
        z-index: 99;
      }

      /* 유의사항 */
      .notice {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
        font-size: 0.75rem;
        text-align: center;
        padding-bottom: 120px;
      }

      /* Media Screen */
      @media screen and (min-width: 960px) {

        /* header */
        .header .logo {
          max-width: 148px;
        }

        .header .duration {
          font-size: 1rem;
        }


        .header .weekly_tit {
          display: block;
          width: 77%;
        }

        .promotion-area {
          width: 90vw;
          margin: 2rem auto 10rem;
      }

        .category-title {
          font-size: 2rem;
        }

        .en-product-name {
          font-size: 1rem;
        }

        .ko-product-name {
          font-size: 1rem;
        }

        .product-grid {
          grid-template-columns: repeat(auto-fill, minmax(180px, 2fr));
          gap: 12px;
          padding: 10px;
        }

        .product-img {
          height: 180px;
        }

        .discount-tag {
          background: var(--main-yellow);
          padding: 0 4px;
          border-radius: 10px;
          font-size: 2.3rem;
        }


        .buy-n-get-n-tag {
          height: 3.5rem;
          width: 3.5rem;
          font-size: 1rem;
      }

        .category-title {
          top: calc(-1.25rem - 36px);
        }

        .notice {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo_duration">
        <img src="https://hmartuk.synology.me/assets/general/logo_white.png" alt="H Mart Logo" class="logo">
        <p class="duration"></p>
      </div>
      <img src="weekly_tit.png" class="weekly_tit" alt="Weekly SALE">
    </div>
    <div id="top-promotion-area" class="promotion-area"></div>
    <div id="flyer-container" class="category-section">
      <p style="text-align: center;">세일 정보 도착 중...</p>
    </div>
    <div class="notice">
      <p>While Stocks last. <br>The promotion may be modified or terminated early depending on circumstances. </p>
      <p>프로모션은 당사 및 매장 사정에 따라 사전 고지 없이 내용이 변경되거나 조기 종료될 수 있으며, 준비된 물량(예산) 소진 시 예고 없이 마감될 수 있습니다.</p>
    </div>
    <script>
      const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRNdLEebORD_6PE8kpAPY7kaT70CD9tGT_haBLg3ke0s-ABfvv0Mvk0ze4yCEX-CqUsIJzd_QviJbVU/pub?gid=0&single=true&output=csv';
      async function initFlyer() {
        try {
          const response = await fetch(SHEET_URL);
          const csvText = await response.text();
          Papa.parse(csvText, {
            header: true,
            complete: (results) => {
              renderPage(results.data);
            }
          });
        } catch (error) {
          console.error("데이터 로드 실패:", error);
          document.getElementById('flyer-container').innerHTML = "데이터를 불러오는 데 실패했습니다.";
        }
      }

      function renderPage(data) {
        // --- [날짜 필터링 로직 추가] ---
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const filteredData = data.filter(item => {
          // 1. 데이터가 없거나 enddate가 비어있으면 노출
          if (!item.enddate || item.enddate.trim() === "") return true;
          let dateStr = item.enddate.trim();
          let finalDate;
          // 2. "29.03.2026" 형식을 "2026-03-29"로 변환 시도
          if (dateStr.includes('.')) {
            const parts = dateStr.split('.');
            if (parts.length === 3) {
              // 일.월.년 -> 년-월-일 재조합
              finalDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            }
          } else {
            finalDate = new Date(dateStr);
          }
          // 3. 날짜 해석 실패 시 안전하게 노출
          if (!finalDate || isNaN(finalDate.getTime())) return true;
          // 4. 종료일 당일 밤 11시 59분까지는 노출되도록 설정
          finalDate.setHours(23, 59, 59, 999);
          // 오늘 날짜가 종료일보다 작거나 같을 때만 유지
          return finalDate >= today;
        });
        const displayData = filteredData;
        // --------------------------------
        // --- 1. 날짜 업데이트 ---
        const durationDisplay = document.querySelector('.duration');
        if (displayData.length > 0 && displayData[0].duration) {
          durationDisplay.innerHTML = `${displayData[0].duration}
									
									<br>While Stock last`;
        }
        // --- 2. 상단 프로모션 이미지 업데이트 ---
        const topPromoArea = document.getElementById('top-promotion-area');
        if (displayData.length > 0 && displayData[0].promotion) {
          topPromoArea.innerHTML = `
										
										<img src="${displayData[0].promotion}" alt="Special Promotion">`;
        } else {
          topPromoArea.innerHTML = '';
        }
        // --- 3. 상품 영역 업데이트 ---
        const container = document.getElementById('flyer-container');
        container.innerHTML = '';
        const groups = displayData.reduce((acc, item) => {
          if (!item.category) return acc;
          if (!acc[item.category]) acc[item.category] = [];
          acc[item.category].push(item);
          return acc;
        }, {});
        for (const [category, products] of Object.entries(groups)) {
          let categoryHtml = `
            
											
											<div class="product-container">
												<div class="category-title">${category}</div>
												<div class="product-grid">
                    ${products.map(p => `
                        
													
													<div class="card">
                            ${p.discount ? `
														
														<div class="discount-tag">${p.discount}
															
															<div class="discount-tag-per-off">
																<p class="per">%</p>
																<p class="off">OFF</p>
															</div>
														</div>` : ''}
                            ${p['buy-n-get-n'] ? `
														
														<div class="buy-n-get-n-tag">
															<span>${p['buy-n-get-n']}</span>
														</div>` : ''}
                            
														
														<div class="product-img">
                                ${p.note ? `
															
															<div class="note-tag">${p.note}</div>` : ''}
                                
															
															<img src="${p.img_url}">
															</div>
															<div class="en-product-name">${p.en_name}</div>
															<div class="ko-product-name">${p.ko_name}</div>
															<div class="weight">${p.weight}</div>
															<div class="price">${p.price}</div>
														</div>
                    `).join('')}
                
													
													</div>
												</div>
        `;
          container.innerHTML += categoryHtml;
        }
      }
      initFlyer();
    </script>
  </body>
</html>
